<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Leave a Review | Terrell Tinsley Coaching</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Brand Fonts & Styles -->
  <link href="https://fonts.googleapis.com/css?family=Lato:400,700,900|Poppins:400,600|Roboto:400,500,700,900&display=swap" rel="stylesheet">
  <style>
    body {
      background: #181a1b url('https://cdn.prod.website-files.com/6292458ea6c91805d3cb2506/629759bce5f0f5ed3d86fe81_bg-image.jpg') repeat;
      background-size: cover;
      font-family: 'Lato', 'Poppins', 'Roboto', Arial, sans-serif;
      color: #22313a;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .review-section {
      background: #f3ede3;
      border-radius: 16px;
      box-shadow: 0 6px 32px rgba(50,105,120,0.09);
      max-width: 420px;
      width: 95%;
      padding: 2.5em 1.5em 2em 1.5em;
      margin: 3em auto;
    }
    .review-title {
      color: #22313a;
      font-size: 2em;
      font-weight: 800;
      text-align: center;
      margin-bottom: 0.6em;
      letter-spacing: 0.01em;
    }
    .review-logo-img:hover, .review-logo-img:focus {
      transform: scale(1.07) rotate(-5deg);
      box-shadow: 0 0 0 8px rgba(50,105,120,0.13);
      cursor: pointer;
    }
    @media (max-width: 500px) {
      .review-logo-img {
        width: 34px;
        height: 34px;
      }
      .review-title-row {
        gap: 10px;
      }
    }
    .review-form label {
      display: block;
      margin-top: 1.1em;
      margin-bottom: 0.3em;
      color: #29414c;
      font-weight: 600;
      font-size: 1.05em;
    }
    .review-form input[type="text"],
    .review-form textarea {
      width: 100%;
      padding: 0.7em 0.9em;
      border: 1.5px solid #c4a96a;
      border-radius: 7px;
      font-size: 1em;
      font-family: inherit;
      margin-bottom: 0.7em;
      background: #fff;
      color: #22313a;
      transition: border 0.2s;
      box-sizing: border-box;
    }
    .review-form input[type="text"]:focus,
    .review-form textarea:focus {
      border-color: #326978;
      outline: none;
    }
    .review-form textarea {
      min-height: 110px;
      max-height: 260px;
      resize: vertical;
    }
    .review-btn {
      background: linear-gradient(90deg, #326978 60%, #15374e 100%);
      color: #f3ede3;
      font-weight: 700;
      padding: 0.7em 2.2em;
      border-radius: 8px;
      font-size: 1.1em;
      border: none;
      cursor: pointer;
      margin: 1.1em 0 0 0;
      display: block;
      width: 100%;
      transition: background 0.18s, color 0.18s;
    }
    .review-btn:hover, .review-btn:focus {
      background: #f3ede3;
      color: #326978;
      border: 1.5px solid #326978;
    }
    .review-success, .review-error {
      text-align: center;
      margin-top: 1.3em;
      font-size: 1.1em;
      display: none;
    }
    .review-success {
      color: #326978;
      font-weight: 700;
    }
    .review-error {
      color: #d7263d;
      font-weight: 600;
    }
    @media (max-width: 600px) {
      .review-section {
        padding: 1.1em 0.4em 1.4em 0.4em;
      }
      .review-title {
        font-size: 1.3em;
      }
    }
  </style>
</head>
<body>
  <div class="review-section">
    <div class="review-title-row" style="display: flex; align-items: center; justify-content: center; gap: 18px;">
      <div class="review-title">Leave a Review</div>
      <a href="/index.html" aria-label="Back to Home">
        <img src="/images/allthree.png" alt="Back to Home" class="review-logo-img" style="width:48px; height:48px; border-radius:50%; box-shadow:0 2px 10px rgba(50,105,120,0.07); transition:transform 0.18s;">
      </a>
    </div>
    <form name="review" method="POST" data-netlify="true" netlify-honeypot="bot-field" class="review-form" id="reviewForm" autocomplete="off">
      <input type="hidden" name="form-name" value="review">
      <p style="display:none;">
        <label>Don’t fill this out if you’re human: <input name="bot-field"></label>
      </p>
      <label for="firstName">First Name</label>
      <input type="text" id="firstName" name="firstName" maxlength="25" required placeholder="Your first name">

      <label for="lastInitial">Last Initial</label>
      <input type="text" id="lastInitial" name="lastInitial" maxlength="1" required placeholder="E.g., T">

      <label for="reviewText">Your Review</label>
      <textarea id="reviewText" name="reviewText" maxlength="600" required placeholder="Share your experience..."></textarea>

      <button type="submit" class="review-btn">Submit Review</button>
      <div class="review-success" id="reviewSuccess"></div>
      <div class="review-error" id="reviewError">Please fill out all fields.</div>
    </form>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const form = document.getElementById('reviewForm');
      const successMsg = document.getElementById('reviewSuccess');
      const errorMsg = document.getElementById('reviewError');

      form.addEventListener('submit', function(e) {
        // 1. Stop the page from reloading
        e.preventDefault();
        
        const firstName = document.getElementById('firstName').value.trim();
        const lastInitial = document.getElementById('lastInitial').value.trim();
        const reviewText = document.getElementById('reviewText').value.trim();

        if(firstName && lastInitial && reviewText) {
          
          // 2. Build the new success message with the drop-down template
          successMsg.innerHTML = 
            `<div>Thank you for your review!</div>
            <div style="margin-top:1em;">
              <strong>Here's what you wrote:</strong>
              <div style="background:#fff; border-radius:8px; margin:1em 0; padding:1em; color:#22313a; box-shadow:0 2px 8px rgba(50,105,120,0.06); font-size:1em;">
                <b>${firstName} ${lastInitial}.</b><br>
                ${reviewText.replace(/\n/g, "<br>")}
              </div>
              
              <div style="margin-bottom: 24px;">
                If you have a moment, please <a href="https://g.page/r/CQivTiKUBBC4EAE/review" target="_blank" id="googleReviewLink" style="color:#326978; font-weight:700; text-decoration:underline;">copy your review to Google</a> as well.<br>It helps others find support!
              </div>

              <hr style="border: 0; border-top: 1px solid rgba(50,105,120,0.2); margin: 24px 0;">
              
              <div style="background: rgba(50, 105, 120, 0.1); padding: 18px; border-radius: 8px; border-left: 4px solid #326978; text-align: left;">
                <h4 style="margin: 0 0 8px 0; color: #15374e; font-size: 1.1em;">A Gift to Pass On</h4>
                <p style="margin: 0; font-size: 0.95em; color: #29414c; line-height: 1.5;">Thank you again for taking the time to leave a review.<br><br>As a small thank you, I'd love to pass that kindness along. I'd like to gift <strong>one complimentary coaching conversation</strong> to someone you care about.<br><br> If someone comes to mind, send them the message below and have them mention your name when they reach out.</p>
                
                <div style="margin-top: 16px;">
                  <details style="cursor: pointer; outline: none;">
                    <summary style="color: #326978; font-weight: 700; font-size: 0.9em; text-decoration: underline;">Not sure what to say? Click here for a quick text template you can copy and paste.</summary>
                    <div style="background: #fff; border: 1px solid rgba(50,105,120,0.2); padding: 12px; border-radius: 6px; margin-top: 12px; font-size: 0.95em; color: #29414c; line-height: 1.5; cursor: text;">
                      Hey [Name]! I recently had a coaching conversation with Terrell, and it gave me the chance to slow down and think through a few things. As a thank you for leaving him a review, he gave me a complimentary session to pass along to someone. I thought of you. If you're interested, I'd be happy to introduce you.
                    </div>
                  </details>
                </div>

              </div>
            </div>`;
            
          successMsg.style.display = 'block';
          errorMsg.style.display = 'none';
          
          // Hide the form fields
          form.querySelectorAll('input, textarea, button, label').forEach(el => el.style.display = 'none');
          
          // 3. Send the review directly to Netlify in the background
          const formData = new FormData(form);
          fetch("/", {
              method: "POST",
              headers: { "Content-Type": "application/x-www-form-urlencoded" },
              body: new URLSearchParams(formData).toString()
          }).catch((error) => console.error('Form submission error:', error));

        } else {
          errorMsg.style.display = 'block';
          successMsg.style.display = 'none';
        }
      });

      // Google Analytics click tracking
      document.addEventListener('click', function(e) {
        if (e.target && e.target.id === 'googleReviewLink' && window.gtag) {
          gtag('event', 'click', {
            'event_category': 'review',
            'event_label': 'Google Review Link Clicked'
          });
        }
      });
    });
  </script>
</body>
</html>
